appId: com.stemkit.app
productName: StemKit
directories:
  output: release
files:
  - out/**/*
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: danvelope
  repo: stemkit
extraResources:
  - from: python
    to: python
mac:
  category: public.app-category.music
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  extraResources:
    - from: extras/ffmpeg-mac/ffmpeg
      to: ffmpeg/ffmpeg
win:
  icon: build/icon.png
  target:
    - target: nsis
    - target: zip
  extraResources:
    - from: extras/ffmpeg-win/ffmpeg.exe
      to: ffmpeg/ffmpeg.exe
nsis:
  oneClick: true
  perMachine: false
