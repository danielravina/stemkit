name: windows-smoke

# installs the NSIS build silently, then runs the app's self-test mode
# (STEMKIT_SMOKE=1): full bootstrap on a python-less runner (runtime download
# + sha256 verification + hash-pinned pip installs), separating a generated
# tone through both engines (roformer's own checkpoint download + integrity
# check), the digest-verified htdemucs_ft downloads, then the GPU plumbing:
# the cuda fail-fast paths plus the CUDA engine install from the hashed cu121
# lock (torch.version.cuda set, cuda.is_available() still false with no
# NVIDIA driver). Run manually before cutting a release
on:
  workflow_dispatch:
  workflow_call:

jobs:
  smoke:
    runs-on: windows-latest
    # the GPU section adds a ~2.5GB CUDA torch install and the fine-tuned
    # engine ~320MB (skippable via STEMKIT_SMOKE_SKIP_GPU=1 /
    # STEMKIT_SMOKE_SKIP_FT=1); real CUDA execution needs NVIDIA hardware
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch ffmpeg (win)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1

      - run: npx electron-vite build

      - run: npx electron-builder --win --publish never

      - name: Install (NSIS silent)
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "no installer exe found in release/" }
          Write-Host "installer: $($installer.FullName)"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          Write-Host "installer exit: $($p.ExitCode)"
          # the installer can hand off to a child process; poll for the exe
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 2
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "StemKit.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          } until ($exe -or (Get-Date) -gt $deadline)
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "programs dir: $($_.Name)" }
          if (-not $exe) { throw "StemKit.exe not found after install" }
          Write-Host "installed: $($exe.FullName)"
          Add-Content $env:GITHUB_ENV "STEMKIT_EXE=$($exe.FullName)"

      - name: Smoke (bootstrap + both engines)
        shell: pwsh
        run: |
          $env:STEMKIT_SMOKE = '1'
          $p = Start-Process -FilePath $env:STEMKIT_EXE -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Print smoke log
        if: always()
        shell: pwsh
        run: if (Test-Path "$env:TEMP\stemkit-smoke.log") { Get-Content "$env:TEMP\stemkit-smoke.log" }

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: ${{ runner.temp }}/stemkit-smoke.log
          if-no-files-found: ignore
